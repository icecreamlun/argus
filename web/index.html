<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Argus — San Francisco</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311161c'/%3E%3Cpath d='M5 16h5l2.5-6 4 13 3-9 2 2h5.5' fill='none' stroke='%23f2621b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <!-- Start the two big downloads while the module graph is still being fetched. -->
    <link rel="preload" href="/data/city.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/terrain.bin" as="fetch" crossorigin />
    <style>
      /* Boot screen: painted before any script runs; driven by src/app/bootScreen.ts. */
      html,
      body {
        background: #11161c;
      }
      #boot {
        --boot-p: 0.02;
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 80% at 50% 115%, rgba(242, 98, 27, 0.16), transparent 60%),
          radial-gradient(90% 60% at 50% -10%, #2a3a4c, transparent 70%),
          #11161c;
        color: #e9e6df;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.6s;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot__card {
        width: min(360px, 80vw);
        display: grid;
        gap: 14px;
      }
      .boot__word {
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }
      .boot__tag {
        margin-top: -8px;
        font: 500 11.5px/1.3 'Inter', system-ui, sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8d96a0;
      }
      .boot__bar {
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      .boot__bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 100%;
        background: #f2621b;
        transform-origin: 0 50%;
        transform: scaleX(var(--boot-p));
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .boot__status {
        font: 400 12px/1.4 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        color: #a7aeb6;
        min-height: 1.4em;
      }
      #boot.is-error .boot__bar::after {
        background: #d7261e;
      }
      #boot.is-error .boot__status {
        color: #ffb4a8;
        white-space: pre-wrap;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        .boot__bar::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="ui-root"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot__card">
        <div class="boot__word">Argus</div>
        <div class="boot__tag">San Francisco · Ferry Building → Chinatown</div>
        <div class="boot__bar"></div>
        <div class="boot__status">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
